<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Web Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🌟 Welcome to My Interactive Page 🌟</h1>

  <!-- Part 1: Event Handling Example -->
  <button id="messageBtn">Click Me</button>
  <p id="messageOutput"></p>

  <!-- Part 2: Interactive Elements -->
  <section class="features">
    <h2>Interactive Features</h2>

    <!-- Light/Dark Mode -->
    <button id="themeToggle">Toggle Light/Dark Mode</button>

    <!-- Counter -->
    <div class="counter">
      <h3>Counter</h3>
      <button id="decrement">-</button>
      <span id="count">0</span>
      <button id="increment">+</button>
    </div>

    <!-- Collapsible FAQ -->
    <div class="faq">
      <h3>FAQ</h3>
      <button class="faq-toggle">What is this project about?</button>
      <p class="faq-answer hidden">This is a demo of JavaScript interactivity: events, DOM manipulation, and form validation.</p>
    </div>
  </section>

  <!-- Part 3: Form Validation -->
  <section class="form-section">
    <h2>Sign Up Form</h2>
    <form id="signupForm">
      <label>
        Name:
        <input type="text" id="name" />
        <span class="error" id="nameError"></span>
      </label>
      <br />
      <label>
        Email:
        <input type="text" id="email" />
        <span class="error" id="emailError"></span>
      </label>
      <br />
      <label>
        Password:
        <input type="password" id="password" />
        <span class="error" id="passwordError"></span>
      </label>
      <br />
      <button type="submit">Submit</button>
    </form>
    <p id="formSuccess" class="success"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
