<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Animations</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1> Bringing Web Pages to Life </h1>

  <!-- Part 1: CSS Animations -->
  <section>
    <h2>Part 1: CSS Transitions & Animations</h2>
    <button class="hover-btn">Hover Me!</button>
    <div class="animated-box"></div>
  </section>

  <!-- Part 2: JavaScript Functions -->
  <section>
    <h2>Part 2: JavaScript Functions</h2>
    <p id="functionResult">Result will appear here...</p>
    <button id="calcBtn">Calculate 5 × 10</button>
  </section>

  <!-- Part 3: Combining CSS & JS -->
  <section>
    <h2>Part 3: Combining CSS + JS</h2>
    <button id="animateBtn">Animate the Box</button>
    <div id="jsBox" class="js-box"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
